name: Book my room

# Runs Canal Booker in the cloud every night. GitHub can start scheduled jobs very late
# (hours, on a bad night), so there are five starts, one an hour from about 7:17 pm Ottawa
# time (6:17 pm in winter). The first one that starts waits (a job can run up to 6 hours)
# and gets ready a couple of minutes before midnight; the later starts queue behind it
# and end with "Nothing to do". :17 avoids the top of the hour, when delays are worst.
# For an exact start time, see "Make the start time reliable" in the README.
on:
  schedule:
    - cron: "17 23 * * *"
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
    - cron: "17 2 * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = dry run right now (nothing booked). now = really book every open day in the plan right now. book = wait for the next midnight and book."
        type: choice
        options: [test, now, book]
        default: test
      dates:
        description: "Only with now: the days to book, like 2026-10-02, 2026-10-06. Blank = every open day in the plan."
        type: string
        default: ""

concurrency:
  group: canal-booker
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # Google Chrome is already on GitHub's machines, so no browser download is needed.
        run: pip install -q "playwright>=1.45" tzdata certifi
      - name: Book
        env:
          CARLETON_USERNAME: ${{ secrets.CARLETON_USERNAME }}
          CARLETON_PASSWORD: ${{ secrets.CARLETON_PASSWORD }}
          TEAM_PLAN_URL: ${{ vars.TEAM_PLAN_URL }}
          ROOMS: ${{ vars.ROOMS }}
          STATUS_URL: ${{ vars.STATUS_URL }}
          MODE: ${{ inputs.mode || 'book' }}
          DATES: ${{ inputs.dates }}
        run: python -m app.cloud
