name: Build downloads

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: CanalBooker.exe
          - os: macos-latest
            asset: CanalBooker-Mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # One file per computer, nothing to unzip on Windows. Playwright's browsers are not
      # bundled: the app uses the Edge or Chrome already on the computer.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller run.py --name CanalBooker --onefile --noconsole
          --add-data "app/static;app/static" --add-data "portal_recipe.json;." --add-data "app_defaults.json;."
          --collect-all playwright --hidden-import keyring.backends.Windows
          --exclude-module tkinter --exclude-module unittest --exclude-module pydoc
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item dist/CanalBooker.exe CanalBooker.exe

      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: >
          pyinstaller run.py --name CanalBooker --windowed --onedir
          --add-data "app/static:app/static" --add-data "portal_recipe.json:." --add-data "app_defaults.json:."
          --collect-all playwright --hidden-import keyring.backends.macOS
          --exclude-module tkinter --exclude-module unittest --exclude-module pydoc
      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent CanalBooker.app ../CanalBooker-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            CanalBooker.exe
            CanalBooker-Mac.zip
