name: Build downloads

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: CanalBooker-Windows
          - os: macos-latest
            name: CanalBooker-Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller run.py --name CanalBooker --onefile --noconsole
          --add-data "app/static;app/static" --add-data "portal_recipe.json;." --add-data "app_defaults.json;."
          --collect-all playwright --hidden-import keyring.backends.Windows
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/CanalBooker.exe -DestinationPath ${{ matrix.name }}.zip

      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: >
          pyinstaller run.py --name CanalBooker --windowed --onedir
          --add-data "app/static:app/static" --add-data "portal_recipe.json:." --add-data "app_defaults.json:."
          --collect-all playwright --hidden-import keyring.backends.macOS
      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent CanalBooker.app ../${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
